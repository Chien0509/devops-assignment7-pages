name: Gated GitHub Pages deployment
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'index.md'
      - '_config.yml'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: python3 scripts/validate.py
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages for first deployment
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate generated HTML
        run: python3 scripts/validate.py --site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
